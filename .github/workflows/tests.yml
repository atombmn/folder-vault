name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests, static checks and package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Get .NET Framework 4.8 reference assemblies
        shell: pwsh
        run: ./tests/tools/Get-FVReferenceAssemblies.ps1

      - name: Unit tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 6.2.0
          $c = New-PesterConfiguration
          $c.Run.Path = './tests/unit'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Normal'
          $c.TestResult.Enabled = $true
          $c.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $c

      - name: PSScriptAnalyzer (Windows PowerShell 5.1 profiles)
        shell: pwsh
        run: |
          $r = foreach ($d in 'src', 'install', 'admin', 'build', 'tests/windows') {
            Invoke-ScriptAnalyzer -Path $d -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          }
          $r | Format-Table ScriptName, Line, Severity, RuleName -AutoSize | Out-String -Width 200 | Write-Host
          $errors = @($r | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) { throw "$($errors.Count) analyzer error(s)" }

      - name: Build release zips
        shell: pwsh
        run: ./build/Build-Package.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folder-vault-build
          path: |
            dist/*.zip
            testResults.xml
